<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <!-- THE LAUNCH GATE (2026-10-07, the founder): the page declares one
         colour scheme, so Chrome's and Samsung Internet's automatic dark
         modes leave the design as it is. -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Vexel is a growth partner for businesses that want to grow. Brand, website, marketing and follow-up from one team, with a written number within one business day." />
    <title>Website design and marketing for growing businesses | Vexel</title>
    <!-- OPEN GRAPH DEFAULTS, 2026-09-25 (the release audit): the home page's
         title and description, for share scrapers, which read this file and
         do not run the app. Each page replaces them when it mounts, and sets
         its own canonical URL and og:url (src/pages/site/head.js). No og:url
         or canonical here: a static one would point every route at /.
         The share image is /og/vexeltech.jpg since final22 (it was /og.jpg), drawn in code (.measure/brand-assets.mjs,
         2026-09-25), with the large card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VexelTech" />
    <meta property="og:title" content="Website design and marketing for growing businesses | Vexel" />
    <meta property="og:description" content="Vexel is a growth partner for businesses that want to grow. Brand, website, marketing and follow-up from one team, with a written number within one business day." />
    <meta property="og:image" content="https://vexeltechsolutions.com/og/vexeltech.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The VexelTech wordmark on a dark ground." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://vexeltechsolutions.com/og/vexeltech.jpg" />
    <!-- THE ICONS, 2026-09-25 (the founder's addendum): the V mark in machine
         yellow on the base colour, drawn in code from Wordmark.jsx's path by
         .measure/brand-assets.mjs. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- THE LOUD FACE, preloaded, 2026-09-16. Monigue sets every page heading
         and the hero, and the page is rendered by script, so the face was only
         discovered once the app had mounted: headings painted in the fallback
         and moved when Monigue arrived, 12 to 18px, and rewrapped the About
         hero at 390 (viewer audit). Preloaded from the HTML it is in the cache
         before the first heading is laid out. -->
    <!-- THE MONIGUE PRELOAD CAME OFF (final26, 2026-10-07): since copy V4.1
         the hero sets in Clash, and Monigue paints above the fold on About
         only. Preloaded on every page it was a high-priority request ahead
         of every first paint for a face most pages never show first. It
         loads with font-display swap where it is used. -->
    <!-- THE MONIGUE PRELOAD IS BACK ON EVERY ROUTE (final37, 2026-10-08, the
         founder): every section title is Monigue caps now, and the footer's
         "Let's talk." is on every page. -->
    <link rel="preload" href="/fonts/monigue.woff2" as="font" type="font/woff2" crossorigin />
    <!-- STRUCTURED DATA IS A PUBLISHED CLAIM, held to the same bar as the
         page. Both `telephone` and `address` came out on 2026-09-08 while
         neither was confirmed, because asserting to a crawler what the page
         refuses to show a reader is one detail published at two standards.

         THE ADDRESS IS BACK, confirmed the same day: 6619 Elks Trce,
         Richmond, TX 77406, US. It is the strongest local ranking signal of
         the three and was the real cost of the removal.

         `telephone` IS STILL OUT and stays out until a number is confirmed.
         A NAP that disagrees with other listings is scored against, so a
         wrong number is worse here than a missing one.

         WHEN THE NUMBER LANDS, add it beside `email` as
         "telephone":"+1-XXX-XXX-XXXX" and put the same number in the footer,
         which still shows a placeholder for it.

         `email` and `priceRange` unchanged.

         The four offer URLs point at /services#<discipline>, the canonical
         anchors. They pointed at /services/<discipline>, which have been
         redirects since the sub-service pages came off the router, and
         structured data should name the destination rather than a hop.

         2026-09-23, from "ABOUT KEY FACTS" in the design repo's copy file:
         the Organization description is the founder's definition line (also
         /about-us's meta description; replaced by ABOUT 2026-09-24's), with foundingDate and
         areaServed. `founder` ("Zee", from the About note's signature) CAME
         OUT 2026-09-25 with the note: the About rebuild no longer names a
         founder, and structured data states nothing the page does not.
         `sameAs` is ABSENT because no social URL is set (content/socials.js):
         add them here when they land.

         2026-10-03 (the founder, final6, "open gate"): the description is
         the home meta description, and areaServed is US, GB, IE, EU and AU
         on both nodes, in place of the United States alone.

         COPY V4, 2026-10-06 (the founder): the description matches the new
         /about-us meta description, the company's own definition, in place
         of the home meta. The figures are written here because this file is
         static; content/pricing.js is the source and they match it. -->
    <script type="application/ld+json">
      {
        "@context":"https://schema.org",
        "@graph":[
          {"@type":"Organization","@id":"https://vexeltechsolutions.com/#organization","name":"VexelTech Solutions","url":"https://vexeltechsolutions.com/","logo":"https://vexeltechsolutions.com/og/logo.png","description":"Vexel is a growth partner. We build businesses into bigger ones: the brand, the website, the marketing and the follow-up, from one team.","foundingDate":"2026","email":"info@vexeltechsolutions.com","address":{"@type":"PostalAddress","streetAddress":"6619 Elks Trce","addressLocality":"Richmond","addressRegion":"TX","postalCode":"77406","addressCountry":"US"}},
          {"@type":"WebSite","@id":"https://vexeltechsolutions.com/#website","url":"https://vexeltechsolutions.com/","name":"VexelTech Solutions","publisher":{"@id":"https://vexeltechsolutions.com/#organization"}}
        ]
      }
    </script>
    <!-- The legacy webfonts, the g-wait class and the three cdnjs scripts
         that once sat here went with the legacy tree, which was deleted on
         2026-09-25. DESIGN.md: no third-party request on page load. -->
  </head>
  <body>
    <!-- NETLIFY FORMS DETECTION. The contact form in the footer, on every
         route, 2026-09-22. The footer form is rendered by script, so
         Netlify cannot see its fields without this. It POSTs to "/" with
         form-name "contact". Hidden; never shown. Fields since 2026-09-24:
         name, phone, email, message and the four UTM tags; company and
         budget are gone. Since 2026-09-25 the contact page's form also sends
         "need", the pills it picked, comma-separated, and "budget", the
         one band picked or empty. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="need" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_content" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
