<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFC400" />
    <meta name="description" content="Branding, websites, marketing and automation for startups, SMBs and founders. We show up with the work already built. Book a 15-minute call." />
    <title>Website Design for Startups &amp; Small Business | VexelTech</title>
    <!-- THE NAME FACE, preloaded. Moldie sets the discipline names, the tier
         names, the plate titles and the work numerals, and every one of them
         is above the fold on the page it is on, so it is discovered from the
         stylesheet one round trip too late without this.

         Only the REGULAR. The slanted cut sets two short lines — the plate
         titles and the delta caption — neither of which is a first paint, and
         a second preload competes with this one for the same connection.

         `crossorigin` is not optional on a font preload even from the same
         origin: fonts are fetched in CORS mode, and a preload without it is a
         second, unused download rather than a warm cache entry. -->
    <link rel="preload" href="/fonts/moldie.woff2" as="font" type="font/woff2" crossorigin />
    <!-- THE LOUD FACE, preloaded, 2026-09-16. Monigue sets every page heading
         and the hero, and the page is rendered by script, so the face was only
         discovered once the app had mounted: headings painted in the fallback
         and moved when Monigue arrived, 12 to 18px, and rewrapped the About
         hero at 390 (viewer audit). Preloaded from the HTML it is in the cache
         before the first heading is laid out. The same first-paint test the
         Moldie note applies: every page's heading is above the fold. -->
    <link rel="preload" href="/fonts/monigue.woff2" as="font" type="font/woff2" crossorigin />
    <!-- STRUCTURED DATA IS A PUBLISHED CLAIM, held to the same bar as the
         page. Both `telephone` and `address` came out on 2026-09-08 while
         neither was confirmed, because asserting to a crawler what the page
         refuses to show a reader is one detail published at two standards.

         THE ADDRESS IS BACK, confirmed the same day: 6619 Elks Trce,
         Richmond, TX 77406, US. It is the strongest local ranking signal of
         the three and was the real cost of the removal.

         `telephone` IS STILL OUT and stays out until a number is confirmed.
         A NAP that disagrees with other listings is scored against, so a
         wrong number is worse here than a missing one.

         WHEN THE NUMBER LANDS, add it beside `email` as
         "telephone":"+1-XXX-XXX-XXXX" and put the same number in the footer,
         which still shows a placeholder for it.

         `email` and `priceRange` unchanged.

         The four offer URLs point at /services#<discipline>, the canonical
         anchors. They pointed at /services/<discipline>, which have been
         redirects since the sub-service pages came off the router, and
         structured data should name the destination rather than a hop.

         2026-09-23, from "ABOUT KEY FACTS" in the design repo's copy file:
         the Organization description is the founder's definition line (also
         /about-us's meta description; replaced by ABOUT 2026-09-24's), with foundingDate and
         areaServed. `founder` ("Zee", from the About note's signature) CAME
         OUT 2026-09-25 with the note: the About rebuild no longer names a
         founder, and structured data states nothing the page does not.
         `sameAs` is ABSENT because no social URL is set (content/socials.js):
         add them here when they land. -->
    <script type="application/ld+json">
      {
        "@context":"https://schema.org",
        "@graph":[
          {"@type":"Organization","@id":"https://vexeltechsolutions.com/#organization","name":"VexelTech Solutions","url":"https://vexeltechsolutions.com/","description":"VexelTech Solutions is a technology company that builds the website, the marketing and the automation behind US local service businesses, at flat prices from $299.","foundingDate":"2026","areaServed":{"@type":"Country","name":"United States"},"email":"info@vexeltechsolutions.com","address":{"@type":"PostalAddress","streetAddress":"6619 Elks Trce","addressLocality":"Richmond","addressRegion":"TX","postalCode":"77406","addressCountry":"US"}},
          {"@type":"ProfessionalService","@id":"https://vexeltechsolutions.com/#service","name":"VexelTech Solutions","parentOrganization":{"@id":"https://vexeltechsolutions.com/#organization"},"areaServed":{"@type":"Country","name":"United States"},"priceRange":"$$","hasOfferCatalog":{"@type":"OfferCatalog","name":"Services","itemListElement":[{"@type":"Offer","itemOffered":{"@type":"Service","name":"Brand Identity Design","url":"https://vexeltechsolutions.com/services#branding"}},{"@type":"Offer","itemOffered":{"@type":"Service","name":"Website Design and Development","url":"https://vexeltechsolutions.com/services#websites"}},{"@type":"Offer","itemOffered":{"@type":"Service","name":"Digital Marketing","url":"https://vexeltechsolutions.com/services#marketing"}},{"@type":"Offer","itemOffered":{"@type":"Service","name":"Marketing Automation","url":"https://vexeltechsolutions.com/services#automation"}}]}},
          {"@type":"WebSite","@id":"https://vexeltechsolutions.com/#website","url":"https://vexeltechsolutions.com/","name":"VexelTech Solutions","publisher":{"@id":"https://vexeltechsolutions.com/#organization"}}
        ]
      }
    </script>
    <!-- The webfonts, the g-wait class and the three cdnjs scripts that used
         to sit here have moved into the legacy tree, because `/` is the
         rebuild now and none of them belong on it. Barlow and the g-wait
         class are in src/legacy/LegacyShell.jsx; three.js and GSAP are
         loaded on demand by the one page that uses them, src/pages/HomePage.jsx.
         DESIGN.md: no third-party request on page load. -->
  </head>
  <body>
    <!-- NETLIFY FORMS DETECTION, 2026-09-22. Netlify finds forms by parsing
         the deployed HTML, and the Plan Builder on /pricing is rendered by
         script, so this static twin declares the form and its fields. The
         builder POSTs to "/" with form-name "plan". Hidden; never shown. -->
    <form name="plan" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="plan"></textarea>
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_content" />
      <input type="text" name="bot-field" />
    </form>
    <!-- The contact form in the footer, on every route, 2026-09-22. Same
         reason as the twin above: the footer form is rendered by script, so
         Netlify cannot see its fields without this. It POSTs to "/" with
         form-name "contact". Hidden; never shown. Fields since 2026-09-24:
         name, phone, email, message and the four UTM tags; company and
         budget are gone. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_content" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
